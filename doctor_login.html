<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:url("hosp picture.jpg") no-repeat center center/cover;
    position:relative;
}

/* Dark Overlay */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

.login-box{
    position:relative;
    z-index:2;
    width:90%;
    max-width:400px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    text-align:center;
    color:#fff;
}

.login-box img{
    width:90px;
    margin-bottom:10px;
}

.login-box h2{
    margin-bottom:25px;
    color:#00d4ff;
}

.input-box{
    margin-bottom:18px;
    text-align:left;
}

.input-box label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#00d4ff;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0099cc;
}

.options{
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.options a{
    color:#fff;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

/* Navigation Styling */
nav{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(0,0,0,0.8);
    padding:25px 80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

nav .logo{
    color:#00d4ff;
    font-weight:bold;
    font-size:26px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    color:#fff;
    text-decoration:none;
    transition:.3s;
}

nav ul li a:hover{
    color:#00d4ff;
}

body{
    padding-top:60px;
}

/* Responsive */
@media(max-width:768px){
    .login-box{
        padding:25px;
    }

    .login-box h2{
        font-size:24px;
    }

    button{
        font-size:16px;
    }

    nav ul{
        gap:15px;
    }

    nav ul li a{
        font-size:14px;
    }
}

@media(max-width:480px){
    .login-box{
        width:95%;
        padding:20px;
    }

    .login-box h2{
        font-size:22px;
    }

    .input-box input{
        font-size:15px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        🏥HOSPITAL  APPOINTMENT  SYSTEM
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="doctor_login.html">Doctors</a></li>
        <li><a href="patient_register.html">Patients</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<div class="login-box">

    <h2>Doctor Login</h2>

	 <form action="my_appointment.html">
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Login</button>

        <div class="options">
            <a href="#">Forgot Password?</a>
            <a href="doctor_register.html">Register</a>
        </div>

    </form>

</div>

</body>
</html>
