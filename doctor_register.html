<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
     background-image:  linear-gradient(rgba(0,0,0,0.6),
    rgba(124, 115, 115, 0.6)),
    url("hosp picture.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:480px;
    height: 750px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#0077b6;
    margin-bottom:5px;
}

p{
    text-align:center;
    color:gray;
    margin-bottom:25px;
    font-size:14px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

input, select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
    transition:0.3s;
}

input:focus, select:focus{
    border-color:#0077b6;
    outline:none;
    box-shadow:0 0 5px rgba(0,119,182,0.4);
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    background:linear-gradient(90deg,#0077b6,#00b4d8);
    border:none;
    color:white;
    font-size:16px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 15px rgba(0,0,0,0.2);
}


</style>

</head>

<body>

<div class="container">

<h2> Doctor Registration</h2>
<p>Create your account to manage appointments</p>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter email address" required>

<label>Phone Number</label>
<input type="tel" placeholder="Enter phone number" required>

<label>Specialization</label>
<select required>
    <option value="">Select specialization</option>
    <option>General Physician</option>
    <option>Cardiologist</option>
    <option>Dentist</option>
    <option>Pediatrician</option>
    <option>Surgeon</option>
</select>

<label>Hospital</label>
<select required>
    <option value="">Select hospital</option>
    <option>Sunrise Private Hospital</option>
    <option>King Faisal Hospital</option>
    <option>CHUK Hospital</option>
    <option>Muhima Hospital</option>
    <option>Rwanda Military Hospital</option>
</select>

<label>password</label>
<input type="password" placeholder="Create password" required>

<label>Confirm Password</label>
<input type="password" placeholder="Confirm password" required>

<button type="submit"><a href="welcome_page.html">Register</a></button>

</form>


</div>

</body>
</html>
