<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Hospital Appointment System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url("hosp picture.jpg") no-repeat center center/cover;
    min-height:100vh;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

h1{
    text-align:center;
    color:#00d4ff;
    margin-bottom:30px;
    font-size:38px;
}

.contact-box{
    display:flex;
    gap:30px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

.contact-info,
.contact-form{
    flex:1;
    padding:35px;
    color:#fff;
}

.contact-info h2,
.contact-form h2{
    margin-bottom:20px;
    color:#00d4ff;
}

.contact-info p{
    margin-bottom:15px;
    font-size:17px;
    line-height:1.6;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.contact-form textarea{
    resize:vertical;
    min-height:120px;
}

.contact-form button{
    width:100%;
    padding:12px;
    background:#00d4ff;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.contact-form button:hover{
    background:#0099cc;
}

.map{
    margin-top:30px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.map iframe{
    width:100%;
    height:350px;
    border:0;
}

/* Tablet */
@media(max-width:768px){
    h1{
        font-size:30px;
    }

    .contact-box{
        flex-direction:column;
    }

    .contact-info,
    .contact-form{
        padding:25px;
    }
}

/* Mobile */
@media(max-width:480px){
    h1{
        font-size:26px;
    }

    .contact-info p{
        font-size:15px;
    }

    .contact-form input,
    .contact-form textarea{
        font-size:15px;
    }

    .contact-form button{
        font-size:16px;
    }

    .map iframe{
        height:250px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Contact Us</h1>

<div class="contact-box">

<div class="contact-info">
<h2>Hospital Information</h2>

<p><strong>📍 Address:</strong> KG 15 Ave, Kigali, Rwanda</p>

<p><strong>📞 Phone:</strong> +250 788 123 456</p>

<p><strong>📧 Email:</strong> info@hospital.com</p>

<p><strong>🕒 Working Hours:</strong><br>
Monday - Friday: 8:00 AM - 6:00 PM<br>
Saturday: 9:00 AM - 2:00 PM<br>
Sunday: Emergency Services Only
</p>

</div>

<div class="contact-form">

<h2>Send a Message</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="text" placeholder="Subject" required>

<textarea placeholder="Type your message here..." required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

<div class="map">

<iframe
src="https://www.google.com/maps?q=Kigali,Rwanda&output=embed"
allowfullscreen=""
loading="lazy">
</iframe>

</div>

</div>

</body>
</html>
