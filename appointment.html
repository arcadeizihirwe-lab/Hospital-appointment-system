<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Appointment Page</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background-image:  linear-gradient(rgba(0,0,0,0.6),
    rgba(124, 115, 115, 0.6)),
    url("hosp picture.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

header{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.appointment-box{
    background:rgba(59, 34, 28, 0.5);
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    color:#0077b6;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#0077b6;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#023e8a;
}

.info{
    margin-top:20px;
    background:#abc1d1;
    padding:15px;
    border-radius:10px;
}

#formMessage{
    display:none;
    margin-top:15px;
}

footer{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

@media(max-width:768px){
    .container{
        width:95%;
        padding:10px;
    }
    .appointment-box{
        padding:15px;
    }
    h2{
        font-size:20px;
    }
    input, select, textarea{
        padding:10px;
        font-size:14px;
    }
    button{
        padding:10px;
        font-size:14px;
    }
}

@media(max-width:480px){
    header{
        padding:15px;
    }
    header h1{
        font-size:18px;
        margin:0;
    }
    header p{
        font-size:13px;
        margin:5px 0 0 0;
    }
    .container{
        width:100%;
        margin:0;
        padding:8px;
    }
    .appointment-box{
        padding:12px;
        margin:0;
    }
    h2{
        font-size:16px;
        margin-bottom:10px;
    }
    label{
        font-size:13px;
    }
    input, select, textarea{
        padding:10px;
        margin-top:6px;
        margin-bottom:12px;
        font-size:13px;
    }
    button{
        padding:10px;
        font-size:13px;
    }
    .info{
        padding:12px;
        margin-top:15px;
    }
    .info h2{
        font-size:14px;
    }
    .info p{
        font-size:12px;
    }
    footer{
        padding:10px;
        font-size:12px;
    }
}

</style>

</head>
<body>

<header>
    <h1> quickcare appointment system</h1>
    <p>Book Your Appointment Easily</p>
</header>

<div class="container">

    <div class="appointment-box">

        <h2>Appointment Form</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>

            <label>Select Department</label>
            <select required>
                <option value="">Choose Department</option>
                <option>General Consultation</option>
                <option>Cardiology</option>
                <option>Maternity</option>
                <option>Laboratory</option>
                <option>Dental Care</option>
            </select>
            <label>Select Doctor</label>
      <select required>
          <option value="">Choose Doctor</option>

           <option>Dr. John Nkurunziza - Sunrise Hospital</option>
           <option>Dr. Alice Uwimana - King Faisal Hospital</option>
           <option>Dr. Jean Paul - CHUK Hospital</option>
           <option>Dr. Marie Claire - Muhima Hospital</option>
            <option>Dr. David Habimana - Rwanda Military Hospital</option>

</select>

            <label>Appointment Date</label>
            <input type="date" required>

            <label>Appointment Time</label>
            <input type="time" required>

            <label>Additional Message</label>
            <textarea rows="4" placeholder="Write your message here"></textarea>

            <button type="submit">Book Appointment</button>

        </form>

        <div id="formMessage" class="info"></div>

        <div class="info">
            <h2> Thanks for choosing quickcare appointment system</h2>
            <p>
        
            </p>
        </div>

    </div>

</div>

<footer>
    <p> quickcare appointment system. All Rights Reserved.</p>
</footer>

<script>
const form = document.querySelector('form');
const formMessage = document.getElementById('formMessage');
const dateInput = document.querySelector('input[type="date"]');

if (dateInput) {
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;
}

if (form) {
    form.addEventListener('submit', function (event) {
        event.preventDefault();

        const requiredFields = form.querySelectorAll('input[required], select[required], textarea[required]');
        let isValid = true;

        requiredFields.forEach(function (field) {
            if (!field.value.trim()) {
                isValid = false;
            }
        });

        if (!isValid) {
            formMessage.style.display = 'block';
            formMessage.style.background = '#f8d7da';
            formMessage.style.color = '#721c24';
            formMessage.innerHTML = '<h2>Please fill in all required fields.</h2>';
            return;
        }

        formMessage.style.display = 'block';
        formMessage.style.background = '#d4edda';
        formMessage.style.color = '#155724';
        formMessage.innerHTML = '<h2>Appointment booked successfully!</h2><p>Thank you for choosing QuickCare. We will contact you shortly.</p>';
        form.reset();
    });
}
</script>

</body>
</html>
