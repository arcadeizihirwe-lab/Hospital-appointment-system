<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
      background-image:  linear-gradient(rgba(131, 129, 129, 0.6),
    rgba(77, 75, 75, 0.6)),
    url("hosp picture.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:850px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.left{
    width:60%;
    background:#0077ff;
    color:white;
    padding:60px 40px;
}

.left h1{
    font-size:35px;
    margin-bottom:20px;
}

.left p{
    font-size:18px;
    line-height:28px;
}

.right{
    width:60%;
    padding:60px;
    text-align:center;
}

.right h2{
    color:#0077ff;
    margin-bottom:15px;
}

.right p{
    color:gray;
    margin-bottom:30px;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    margin:20px 0;
    text-decoration:none;
    background:#0077ff;
    color:white;
    border-radius:10px;
    font-size:18px;
    transition:0.3s;
}

.btn:hover{
    background:#0057cc;
    transform:translateY(-3px);
}

.footer{
    margin-top:30px;
    color:gray;
}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1> Hospital Appointment System</h1>

<p>

Book appointments easily, connect patients with doctors, and manage healthcare services online.

</p>

</div>

<div class="right">

<h2>Welcome</h2>

<p>Select how you want to register</p>

<a href="patient_register.html" class="btn">
 REQUEST AN APPOINTMENT
</a>

<a href="doctor_register.html" class="btn">
 Register as Doctor
</a>

<a href="login.htm" class="btn">
 Sign in
</a>
<div class="footer">

Fast  Secure  Easy

</div>

</div>

</div>

</body>
</html>
