<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
      background-image:  linear-gradient(rgba(131, 129, 129, 0.6),
    rgba(77, 75, 75, 0.6)),
    url("hosp picture.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:850px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-wrap:wrap;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.left{
    width:50%;
    background:#0077ff;
    color:white;
    padding:40px 30px;
}

.left h1{
    font-size:28px;
    margin-bottom:20px;
}

.left p{
    font-size:16px;
    line-height:24px;
}

.right{
    width:50%;
    padding:40px 30px;
    text-align:center;
}

.right h2{
    color:#0077ff;
    margin-bottom:15px;
}

.right p{
    color:gray;
    margin-bottom:30px;
}

.btn{
    display:block;
    width:100%;
    padding:12px;
    margin:15px 0;
    text-decoration:none;
    background:#0077ff;
    color:white;
    border-radius:10px;
    font-size:16px;
    transition:0.3s;
}

.btn:hover{
    background:#0057cc;
    transform:translateY(-3px);
}

.footer{
    margin-top:30px;
    color:gray;
}

@media(max-width:768px){
    .container{
        flex-direction:column;
    }
    .left, .right{
        width:100%;
        padding:30px 20px;
    }
    .left h1{
        font-size:24px;
    }
    .left p{
        font-size:14px;
    }
    .btn{
        font-size:14px;
        padding:10px;
    }
}

@media(max-width:480px){
    body{
        min-height:100vh;
        padding:10px;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    .container{
        margin:auto;
        border-radius:15px;
        width:100%;
        max-width:420px;
    }
    .left, .right{
        padding:20px 15px;
    }
    .left h1{
        font-size:20px;
        margin-bottom:15px;
    }
    .left p{
        font-size:13px;
        line-height:20px;
    }
    .right h2{
        font-size:18px;
    }
    .right p{
        margin-bottom:20px;
        font-size:13px;
    }
    .btn{
        font-size:13px;
        padding:10px;
        margin:10px 0;
    }
    .footer{
        margin-top:20px;
        font-size:12px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1> Hospital Appointment System</h1>

<p>

Book appointments easily, connect patients with doctors, and manage healthcare services online.

</p>

</div>

<div class="right">

<h2>Welcome</h2>

<p>Select how you want to register</p>

<a href="patient_register.html" class="btn">
 REQUEST AN APPOINTMENT
</a>

<a href="doctor_register.html" class="btn">
 Register as Doctor
</a>

<a href="login.htm" class="btn">
 Sign in
</a>
<div class="footer">

Fast  Secure  Easy

</div>

</div>

</div>

</body>
</html>
